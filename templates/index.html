<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sentiment Analysis</title>
    <script>
        async function getPrediction() {
            const review = document.getElementById("review").value;
            const response = await fetch("/predict", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({ review: review })
            });
            const data = await response.json();
            document.getElementById("result").innerText = "Sentiment: " + (data.sentiment || "Error");
        }
    </script>
</head>
<body>
    <h1>Sentiment Analysis</h1>
    <textarea id="review" rows="5" cols="50" placeholder="Enter your review here..."></textarea><br>
    <button onclick="getPrediction()">Analyze Sentiment</button>
    <h3 id="result"></h3>
</body>
</html>
